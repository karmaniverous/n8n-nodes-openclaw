services:
  # Run tests
  test:
    build: .
    command: npm test
    environment:
      - OPENCLAW_GATEWAY_URL=http://host.docker.internal:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Run n8n with our node installed
  n8n:
    build: .
    command: npx n8n start
    ports:
      - "5678:5678"
    environment:
      - N8N_CUSTOM_EXTENSIONS=/app/dist
      - OPENCLAW_GATEWAY_URL=http://host.docker.internal:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
